[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-surveillance-ai"
version = "0.1.0"
description = "AI-powered camera surveillance using YOLO detection, ByteTrack tracking, virtual zones, and event rules."
readme = "README.md"
requires-python = ">=3.12,<3.13"

authors = [
    { name = "Truefox AI Inc" }
]

dependencies = [
    "ultralytics>=8.3,<9.0",
    "opencv-python-headless>=4.10,<5.0",
    "numpy>=1.26,<3.0",
    "pillow>=10.0,<12.0",
    "pyyaml>=6.0,<7.0",
    "loguru>=0.7,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.37,<2.0",
    "pandas>=2.2,<3.0",
]

development = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

all = [
    "streamlit>=1.37,<2.0",
    "pandas>=2.2,<3.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[project.scripts]
camera-api = "api.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "events*",
    "src*",
]
exclude = [
    "tests*",
    "datasets*",
    "models*",
    "reports*",
    "experiments*",
    "documentation*",
    "dashboard*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".venv",
    "datasets",
    "models",
    "reports",
    "experiments",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "datasets/",
    "models/",
    "reports/",
    "experiments/",
]